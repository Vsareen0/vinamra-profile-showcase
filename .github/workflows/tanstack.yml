name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: bun run build

      - name: Inspect output
        run: |
          echo "===== PUBLIC OUTPUT ====="
          find .output/public -maxdepth 4 -type f | sort

      - name: Prepare GitHub Pages
        run: |
          touch .output/public/.nojekyll

          if [ -f ".output/public/_shell.html" ]; then
            cp .output/public/_shell.html .output/public/index.html
            cp .output/public/_shell.html .output/public/404.html
          elif [ -f ".output/public/index.html" ]; then
            cp .output/public/index.html .output/public/404.html
          else
            echo "ERROR: No SPA shell generated"
            find .output/public -maxdepth 3 -type f
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
