name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (static prerender)
        env:
          # Project pages are served from https://<user>.github.io/<repo>/.
          # Leave empty (BASE_PATH: "/") if you use a custom domain or a user/org site.
          BASE_PATH: /${{ github.event.repository.name }}/
        run: bun run build

      - name: Prepare static output
        run: |
          # SPA fallback + disable Jekyll processing
          cp dist/client/index.html dist/client/404.html || true
          touch dist/client/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
