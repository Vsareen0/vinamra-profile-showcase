name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build GitHub Pages site
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: bun run build:pages

      - name: Prepare GitHub Pages
        run: |
          touch dist-pages/.nojekyll

          if [ -f "dist-pages/index.html" ]; then
            cp dist-pages/index.html dist-pages/404.html
          else
            echo "ERROR: dist-pages/index.html was not generated"
            find dist-pages -maxdepth 3 -type f || true
            exit 1
          fi

      - name: Inspect output
        run: |
          echo "===== GitHub Pages Output ====="
          find dist-pages -maxdepth 3 -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
